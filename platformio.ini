; PlatformIO project for the Waveshare ESP32-S3-ETH-8DI-8RO
; 8-relay chase: relays 1->8 turn ON one after another (2s apart),
; then 1->8 turn OFF one after another (2s apart), repeating forever.
;
; Relays on this board are NOT on direct ESP32 GPIOs - they sit behind a
; TCA9554PWR I2C GPIO expander (address 0x20) on the RTC I2C bus
; (SDA = GPIO42, SCL = GPIO41). See src/main.cpp and README.md for details.

[env:esp32-s3-relay-chase]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; USB Mode = "Hardware CDC and JTAG" (this board's native USB uses the
; internal PHY, which only supports this mode, not OTG/TinyUSB CDC).
; NOTE: no PSRAM here - Waveshare's own spec page for this board never
; mentions PSRAM, and forcing OPI PSRAM on a chip that doesn't have it
; hangs the bootloader silently right after the ROM banner. Leave PSRAM
; untouched (disabled) unless real hardware testing proves otherwise.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

board_upload.flash_size = 16MB
